<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New listing – Handcrafted Goods Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-50 text-slate-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <a href="index.html" class="font-serif text-xl font-bold text-indigo-900">Handcrafted Goods</a>
      <nav class="flex gap-4 text-sm font-medium">
        <a href="catalog.html" class="text-indigo-800 underline">Browse</a>
        <a href="cart.html" class="text-indigo-800 underline">Cart</a>
        <a href="artisan-listings.html" class="text-indigo-800 underline">Sell</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-xl px-4 py-8">
    <h1 class="font-serif text-3xl font-bold text-indigo-900">Create a listing</h1>
    <p class="mt-2 text-slate-700">Artisan accounts only. Add up to 5 photos of your piece.</p>

    <div id="error-box" role="alert" class="mt-6 hidden rounded border border-red-300 bg-red-50 p-3 text-sm text-red-800"></div>
    <div id="success-box" role="status" class="mt-6 hidden rounded border border-green-300 bg-green-50 p-3 text-sm text-green-900"></div>

    <form id="listing-form" class="mt-6 space-y-5" novalidate>
      <div>
        <label for="title" class="block text-sm font-medium">Title</label>
        <input id="title" type="text" maxlength="120" required class="mt-1 w-full rounded border border-slate-400 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-700">
        <p id="title-error" class="mt-1 hidden text-sm text-red-700"></p>
      </div>
      <div>
        <label for="desc" class="block text-sm font-medium">Description</label>
        <textarea id="desc" rows="4" required class="mt-1 w-full rounded border border-slate-400 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-700"></textarea>
        <p id="desc-error" class="mt-1 hidden text-sm text-red-700"></p>
      </div>
      <div>
        <label for="category" class="block text-sm font-medium">Category</label>
        <select id="category" required class="mt-1 w-full rounded border border-slate-400 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-700">
          <option value="">Choose a category</option>
        </select>
        <p id="category-error" class="mt-1 hidden text-sm text-red-700"></p>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label for="price" class="block text-sm font-medium">Price (₹)</label>
          <input id="price" type="number" step="0.01" min="0.01" inputmode="decimal" required class="mt-1 w-full rounded border border-slate-400 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-700">
          <p id="price-error" class="mt-1 hidden text-sm text-red-700"></p>
        </div>
        <div>
          <label for="stock_qty" class="block text-sm font-medium">Stock quantity</label>
          <input id="stock_qty" type="number" step="1" min="0" inputmode="numeric" required class="mt-1 w-full rounded border border-slate-400 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-700">
          <p id="stock_qty-error" class="mt-1 hidden text-sm text-red-700"></p>
        </div>
      </div>
      <div>
        <label for="images" class="block text-sm font-medium">Photos (up to 5, JPG, PNG or WebP, 5 MB each)</label>
        <input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple class="mt-1 block w-full text-sm">
        <p id="images-error" class="mt-1 hidden text-sm text-red-700"></p>
        <ul id="image-list" class="mt-3 grid grid-cols-3 gap-3 sm:grid-cols-5"></ul>
      </div>
      <button id="submit-btn" type="submit" class="w-full rounded bg-indigo-900 px-4 py-2 font-medium text-white hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-700 focus:ring-offset-2 disabled:opacity-60">Publish listing</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";

    const MAX_IMAGES = 5, MAX_BYTES = 5 * 1024 * 1024, OK_TYPES = ["image/jpeg", "image/png", "image/webp"];
    let files = [];
    const form = document.getElementById("listing-form");
    const errorBox = document.getElementById("error-box");
    const successBox = document.getElementById("success-box");
    const btn = document.getElementById("submit-btn");
    const list = document.getElementById("image-list");

    function setError(id, msg) {
      const el = document.getElementById(id + "-error");
      el.textContent = msg;
      el.classList.toggle("hidden", !msg);
      document.getElementById(id).setAttribute("aria-invalid", msg ? "true" : "false");
    }

    function renderImages() {
      list.innerHTML = "";
      files.forEach((f, i) => {
        const li = document.createElement("li");
        li.className = "relative";
        const img = document.createElement("img");
        img.src = URL.createObjectURL(f);
        img.alt = "Selected photo " + (i + 1);
        img.className = "h-20 w-full rounded border border-stone-300 object-cover";
        const rm = document.createElement("button");
        rm.type = "button";
        rm.textContent = "Remove";
        rm.setAttribute("aria-label", "Remove photo " + (i + 1));
        rm.className = "mt-1 w-full rounded border border-red-700 px-1 py-0.5 text-xs text-red-800 hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-indigo-700";
        rm.addEventListener("click", () => { files.splice(i, 1); renderImages(); });
        li.append(img, rm);
        list.appendChild(li);
      });
    }

    document.getElementById("images").addEventListener("change", (e) => {
      setError("images", "");
      for (const f of e.target.files) {
        if (files.length >= MAX_IMAGES) { setError("images", "You can add at most 5 photos."); break; }
        if (!OK_TYPES.includes(f.type)) { setError("images", f.name + " is not a JPG, PNG or WebP image."); continue; }
        if (f.size > MAX_BYTES) { setError("images", f.name + " is larger than 5 MB."); continue; }
        files.push(f);
      }
      e.target.value = "";
      renderImages();
    });

    (async () => {
      try {
        const data = await api.categories();
        const sel = document.getElementById("category");
        data.categories.forEach((c) => {
          const o = document.createElement("option");
          o.value = c.category_id;
          o.textContent = c.name;
          sel.appendChild(o);
        });
      } catch (err) {
        errorBox.textContent = "Could not load categories: " + err.message;
        errorBox.classList.remove("hidden");
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");
      successBox.classList.add("hidden");

      const title = document.getElementById("title").value.trim();
      const desc = document.getElementById("desc").value.trim();
      const category = document.getElementById("category").value;
      const price = parseFloat(document.getElementById("price").value);
      const stockRaw = document.getElementById("stock_qty").value;
      const stock = Number(stockRaw);

      let ok = true;
      const check = (id, bad, msg) => { setError(id, bad ? msg : ""); if (bad) ok = false; };
      check("title", title.length < 3, "Enter a title of at least 3 characters.");
      check("desc", desc.length < 10, "Describe your piece in at least 10 characters.");
      check("category", !category, "Choose a category.");
      check("price", !(price > 0), "Price must be greater than 0.");
      check("stock_qty", stockRaw === "" || !Number.isInteger(stock) || stock < 0, "Stock must be a whole number, 0 or more.");
      if (!ok) return;

      const fd = new FormData();
      fd.append("title", title);
      fd.append("desc", desc);
      fd.append("category_id", category);
      fd.append("price", price.toFixed(2));
      fd.append("stock_qty", String(stock));
      files.forEach((f) => fd.append("images", f));

      btn.disabled = true;
      btn.textContent = "Publishing...";
      try {
        const res = await api.createProduct(fd);
        successBox.innerHTML = 'Listing published' + (res.product_id ? ' (#' + res.product_id + ')' : '') + '. <a href="catalog.html" class="font-medium underline">View the catalog</a>';
        successBox.classList.remove("hidden");
        form.reset();
        files = [];
        renderImages();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Publish listing";
      }
    });
  </script>
</body>
</html>
