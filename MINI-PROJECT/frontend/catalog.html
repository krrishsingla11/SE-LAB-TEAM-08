<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse crafts – Handcrafted Goods Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-50 text-slate-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <a href="index.html" class="font-serif text-xl font-bold text-indigo-900">Handcrafted Goods</a>
      <nav class="flex gap-4 text-sm font-medium">
        <a href="catalog.html" class="text-indigo-800 underline">Browse</a>
        <a href="login.html" class="text-indigo-800 underline">Log in</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8">
    <h1 class="font-serif text-3xl font-bold text-indigo-900">Browse crafts</h1>

    <form id="filter-form" class="mt-6 flex flex-col gap-3 sm:flex-row sm:items-end" role="search">
      <div class="flex-1">
        <label for="q" class="block text-sm font-medium">Search</label>
        <input id="q" type="search" placeholder="Bowl, scarf, lamp..."
          class="mt-1 w-full rounded border border-slate-400 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-700">
      </div>
      <div>
        <label for="category" class="block text-sm font-medium">Category</label>
        <select id="category"
          class="mt-1 w-full rounded border border-slate-400 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-700 sm:w-48">
          <option value="">All categories</option>
        </select>
      </div>
      <button type="submit"
        class="rounded bg-indigo-900 px-5 py-2 font-medium text-white hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-700 focus:ring-offset-2">
        Search
      </button>
    </form>

    <p id="status" class="mt-6 text-slate-700" role="status"></p>
    <div id="grid" class="mt-4 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>

    <nav id="pager" class="mt-8 flex items-center justify-between" aria-label="Pagination">
      <button id="prev" class="rounded border border-indigo-900 px-4 py-2 text-indigo-900 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-700 disabled:opacity-40">Previous</button>
      <span id="page-info" class="text-sm text-slate-700"></span>
      <button id="next" class="rounded border border-indigo-900 px-4 py-2 text-indigo-900 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-700 disabled:opacity-40">Next</button>
    </nav>
  </main>

  <script src="js/api.js"></script>
  <script>
    const PER_PAGE = 6;
    let page = 1, totalPages = 1;
    const grid = document.getElementById("grid");
    const statusEl = document.getElementById("status");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function card(p) {
      const out = !p.in_stock;
      const img = p.image_url
        ? `<img src="${esc(p.image_url)}" alt="${esc(p.title)}" class="h-40 w-full object-cover">`
        : `<div class="flex h-40 w-full items-center justify-center bg-indigo-100 font-serif text-4xl text-indigo-900" aria-hidden="true">${esc(p.title[0])}</div>`;
      return `
        <a href="product.html?id=${p.product_id}" class="block overflow-hidden rounded border border-stone-300 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-700">
          ${img}
          <div class="p-4">
            <h2 class="font-serif text-lg font-bold text-indigo-900">${esc(p.title)}</h2>
            <p class="text-sm text-slate-700">by ${esc(p.artisan_name || "Artisan #" + p.artisan_id)}</p>
            <p class="mt-2 font-medium">₹${Number(p.price).toLocaleString("en-IN")}</p>
            ${out ? '<span class="mt-2 inline-block rounded bg-red-100 px-2 py-0.5 text-xs font-medium text-red-800">Out of stock</span>' : ""}
          </div>
        </a>`;
    }

    async function load() {
      const q = document.getElementById("q").value.trim();
      const category = document.getElementById("category").value;
      statusEl.textContent = "Loading crafts...";
      grid.innerHTML = "";
      try {
        const data = await api.products(q, category, page, PER_PAGE);
        const list = Array.isArray(data) ? data : data.products;
        totalPages = Math.max(1, Math.ceil((data.total || 0) / PER_PAGE));
        if (!list.length) {
          statusEl.textContent = "No crafts match your search. Try a different word or category.";
        } else {
          statusEl.textContent = "";
          grid.innerHTML = list.map(card).join("");
        }
        document.getElementById("page-info").textContent = `Page ${page} of ${totalPages}`;
        prev.disabled = page <= 1;
        next.disabled = page >= totalPages;
      } catch (err) {
        statusEl.textContent = err.message;
      }
    }

    document.getElementById("filter-form").addEventListener("submit", (e) => {
      e.preventDefault();
      page = 1;
      load();
    });
    prev.addEventListener("click", () => { page--; load(); });
    next.addEventListener("click", () => { page++; load(); });
    (async () => {
      try {
        const data = await api.categories();
        const sel = document.getElementById("category");
        data.categories.forEach((cat) => {
          const o = document.createElement("option");
          o.value = cat.category_id;
          o.textContent = cat.name;
          sel.appendChild(o);
        });
      } catch (err) { /* filter just stays on "All categories" */ }
      load();
    })();
  </script>
</body>
</html>
