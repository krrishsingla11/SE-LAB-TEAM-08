<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout – Handcrafted Goods Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-50 text-slate-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <a href="index.html" class="font-serif text-xl font-bold text-indigo-900">Handcrafted Goods</a>
      <nav id="site-nav"></nav>
    </div>
  </header>

  <main class="mx-auto max-w-xl px-4 py-8">
    <h1 class="font-serif text-3xl font-bold text-indigo-900">Checkout</h1>

    <section aria-labelledby="summary-h" class="mt-6 rounded border border-stone-300 bg-white p-4">
      <h2 id="summary-h" class="font-medium">Order summary</h2>
      <ul id="summary-lines" class="mt-2 space-y-1 text-sm"></ul>
      <p class="mt-3 font-medium">Total: <span id="total">–</span></p>
    </section>

    <div id="error-box" role="alert" class="mt-6 hidden rounded border border-red-300 bg-red-50 p-3 text-sm text-red-800"></div>

    <form id="checkout-form" class="mt-6 space-y-5" novalidate>
      <div>
        <label for="address" class="block text-sm font-medium">Shipping address</label>
        <textarea id="address" rows="3" required class="mt-1 w-full rounded border border-slate-400 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-700"></textarea>
        <p id="address-error" class="mt-1 hidden text-sm text-red-700"></p>
      </div>
      <div>
        <label for="token" class="block text-sm font-medium">Payment method (test mode)</label>
        <select id="token" class="mt-1 w-full rounded border border-slate-400 bg-white px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-700">
          <option value="tok_visa_success">Test Visa (approved)</option>
          <option value="tok_charge_declined">Test card (declined)</option>
        </select>
        <p class="mt-1 text-xs text-slate-600">No real card details are collected. The payment gateway is a stub.</p>
      </div>
      <button id="submit-btn" type="submit" class="w-full rounded bg-indigo-900 px-4 py-2 font-medium text-white hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-700 focus:ring-offset-2 disabled:opacity-60">Place order</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";

    const money = (n) => "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const form = document.getElementById("checkout-form");
    const errorBox = document.getElementById("error-box");
    const btn = document.getElementById("submit-btn");
    const newKey = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : "k" + Date.now() + Math.random());
    let cartLines = [];
    let idemKey = newKey();   // reused only when a retry follows a network failure

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    (async () => {
      try {
        const data = await api.cartGet();
        const lines = data.cart || [];
        cartLines = lines;
        document.getElementById("summary-lines").innerHTML = lines.length
          ? lines.map((l) => `<li class="flex justify-between"><span>${esc(l.title)} × ${l.quantity}</span><span>${money(l.line_total)}</span></li>`).join("")
          : '<li>Your cart is empty. <a href="catalog.html" class="font-medium text-indigo-800 underline">Browse crafts</a></li>';
        document.getElementById("total").textContent = money(data.subtotal || 0);
        if (!lines.length) btn.disabled = true;
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove("hidden");
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");
      const address = document.getElementById("address").value.trim();
      const errEl = document.getElementById("address-error");
      if (address.length < 10) {
        errEl.textContent = "Enter your full shipping address (at least 10 characters).";
        errEl.classList.remove("hidden");
        return;
      }
      errEl.classList.add("hidden");

      btn.disabled = true;
      btn.textContent = "Placing order...";
      try {
        const res = await api.checkout(address, document.getElementById("token").value, idemKey);
        sessionStorage.setItem("lastOrder", JSON.stringify(Object.assign({}, res, {
          shipping_address: address,
          items: cartLines.map((l) => ({ title: l.title, quantity: l.quantity, line_total: l.line_total })),
        })));
        window.location.href = "order-confirmation.html";
        return;
      } catch (err) {
        if (err.status) idemKey = newKey();   // got a real answer from the server: next attempt is a new order
        errorBox.textContent = err.message;
        errorBox.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Place order";
      }
    });
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
