<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artisan dashboard – Handcrafted Goods Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-50 text-slate-900">
<header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <a href="index.html" class="font-serif text-xl font-bold text-indigo-900">Handcrafted Goods</a>
      <nav id="site-nav"></nav>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8">
    <div class="flex flex-wrap items-baseline justify-between gap-2">
      <h1 class="font-serif text-3xl font-bold text-indigo-900">Artisan dashboard</h1>
      <p id="sample-note" class="hidden rounded bg-amber-100 px-2 py-1 text-sm font-medium text-amber-900">Showing sample data</p>
    </div>

    <section aria-labelledby="sales-h" class="mt-6">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 id="sales-h" class="font-serif text-xl font-bold text-indigo-900">Sales analytics</h2>
        <div class="flex flex-wrap items-center gap-2">
          <label for="sales-period" class="text-sm font-medium text-slate-700">Period:</label>
          <select id="sales-period" aria-label="Select sales reporting period"
            class="rounded border border-stone-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-700">
            <option value="monthly" selected>This month</option>
            <option value="weekly">This week</option>
            <option value="yearly">This year</option>
            <option value="all">All time</option>
            <option value="custom">Custom date range</option>
          </select>
        </div>
      </div>
      <div id="custom-range" class="mt-3 hidden flex-wrap items-center gap-2">
        <label for="sales-start" class="text-sm font-medium text-slate-700">From:</label>
        <input type="date" id="sales-start" aria-label="Start date"
          class="rounded border border-stone-300 bg-white px-2 py-1 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-700">
        <label for="sales-end" class="text-sm font-medium text-slate-700">To:</label>
        <input type="date" id="sales-end" aria-label="End date"
          class="rounded border border-stone-300 bg-white px-2 py-1 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-700">
        <button type="button" id="apply-dates"
          class="rounded bg-indigo-900 px-3 py-1 text-sm font-medium text-white hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-700">Apply</button>
      </div>
      <p id="sales-msg" class="mt-2 text-slate-700" role="status">Loading sales...</p>
      <div id="kpis" class="mt-3 grid gap-4 sm:grid-cols-3"></div>
      <div id="top-wrap" class="mt-4 hidden">
        <h3 class="font-medium">Top-selling crafts</h3>
        <ol id="top-items" class="mt-1 list-decimal pl-5 text-sm"></ol>
      </div>
      <div class="mt-4 flex flex-wrap items-center gap-3">
        <button type="button" data-export="csv" class="export rounded border border-indigo-900 px-4 py-2 text-sm font-medium text-indigo-900 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-700 disabled:opacity-60">Export CSV</button>
        <button type="button" data-export="pdf" class="export rounded border border-indigo-900 px-4 py-2 text-sm font-medium text-indigo-900 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-700 disabled:opacity-60">Export PDF</button>
        <p id="export-msg" class="text-sm text-red-800" role="alert"></p>
      </div>
    </section>

    <section aria-labelledby="stock-h" class="mt-10">
      <h2 id="stock-h" class="font-serif text-xl font-bold text-indigo-900">Low-stock alerts</h2>
      <p id="stock-msg" class="mt-2 text-slate-700" role="status">Loading stock alerts...</p>
      <ul id="stock-list" class="mt-3 divide-y divide-stone-300 rounded border border-stone-300 bg-white"></ul>
    </section>

    <section aria-labelledby="products-h" class="mt-10">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 id="products-h" class="font-serif text-xl font-bold text-indigo-900">Your products</h2>
        <div class="flex items-center gap-2">
          <label for="products-category" class="text-sm font-medium text-slate-700">Category:</label>
          <select id="products-category"
            class="rounded border border-stone-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-700">
            <option value="">All categories</option>
          </select>
        </div>
      </div>
      <p id="products-msg" class="mt-2 text-slate-700" role="status">Loading your products...</p>
      <ul id="products-list" class="mt-3 divide-y divide-stone-300 rounded border border-stone-300 bg-white"></ul>
    </section>

    <section aria-labelledby="orders-h" class="mt-10">
      <h2 id="orders-h" class="font-serif text-xl font-bold text-indigo-900">Incoming orders</h2>
      <p id="orders-msg" tabindex="-1" class="mt-2 text-slate-700 focus:outline-none" role="status">Loading orders...</p>
      <div id="orders" class="mt-3 space-y-4"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";
    if (localStorage.getItem("role") === "buyer") window.location.href = "catalog.html";

    // dashboard.html?sample=1 shows example data, for screenshots or when the server has no dashboard routes yet
    const SAMPLE = new URLSearchParams(location.search).get("sample") === "1";
    const NEXT = { Pending: "Processing", Processing: "Shipped", Shipped: "Delivered" };
    const money = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const $ = (id) => document.getElementById(id);
    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    const notReady = (err) => err.status === 404 || err.status === 405;
    const hint = ' <a href="dashboard.html?sample=1" class="font-medium text-indigo-800 underline">Preview with sample data</a>';

    // ----- sample data -----
    const iso = (d) => new Date(Date.now() - d * 864e5).toISOString();
    let sampleOrders = [
      { order_id: 57, status: "Pending", created_at: iso(0), shipping_address: "12 MG Road, Bengaluru 560001", total: 1650,
        items: [{ title: "Ceramic Vase", quantity: 2, unit_price: 450 }, { title: "Silk Scarf", quantity: 1, unit_price: 750 }] },
      { order_id: 56, status: "Processing", created_at: iso(1), shipping_address: "4 Park Street, Kolkata 700016", total: 900,
        items: [{ title: "Ceramic Vase", quantity: 2, unit_price: 450 }] },
      { order_id: 54, status: "Shipped", created_at: iso(3), shipping_address: "9 Anna Salai, Chennai 600002", total: 1200,
        items: [{ title: "Brass Diya Lamp", quantity: 2, unit_price: 600 }] },
      { order_id: 50, status: "Delivered", created_at: iso(9), shipping_address: "21 FC Road, Pune 411004", total: 750,
        items: [{ title: "Silk Scarf", quantity: 1, unit_price: 750 }] },
    ];
    const sampleSales = { revenue: 12450, order_count: 9, units_sold: 21, top_items: [
      { title: "Ceramic Vase", units: 8, revenue: 3600 }, { title: "Silk Scarf", units: 6, revenue: 4500 }, { title: "Brass Diya Lamp", units: 4, revenue: 2400 } ] };
    const sampleStock = { low_stock: [
      { product_id: 2, title: "Silk Scarf", stock_quantity: 1, threshold: 5 }, { product_id: 7, title: "Brass Diya Lamp", stock_quantity: 4, threshold: 5 } ] };

    // ----- sales -----
    async function loadSales(period = "monthly", startDate = "", endDate = "") {
      try {
        $("sales-msg").textContent = "Loading sales...";
        const d = SAMPLE ? sampleSales : await api.salesReport(period, startDate, endDate);
        const revenue = d.revenue ?? d.gross_revenue ?? 0;
        const units = d.units_sold ?? d.units ?? 0;
        const orders = d.order_count ?? 0;
        $("sales-msg").textContent = orders === 0 ? "No completed sales recorded for this period." : "";
        $("kpis").innerHTML = [["Revenue", money(revenue)], ["Orders", orders], ["Units sold", units]]
          .map(([label, value]) => `<div class="rounded border border-stone-300 bg-white p-4"><p class="text-sm text-slate-700">${label}</p><p class="mt-1 font-serif text-2xl font-bold text-indigo-900">${esc(value)}</p></div>`).join("");
        const top = d.top_items || d.items || [];
        if (top.length) {
          $("top-items").innerHTML = top.map((t) =>
            `<li>${esc(t.title || t.name)}: ${t.units ?? t.units_sold ?? t.quantity ?? 0} sold${t.revenue != null ? ", " + money(t.revenue) : ""}</li>`).join("");
          $("top-wrap").classList.remove("hidden");
        } else {
          $("top-wrap").classList.add("hidden");
        }
      } catch (err) {
        $("kpis").innerHTML = "";
        $("top-wrap").classList.add("hidden");
        $("sales-msg").innerHTML = esc(notReady(err) ? "Sales reports aren't available on the server yet." : err.message) + (notReady(err) ? hint : "");
      }
    }

    $("sales-period").addEventListener("change", (e) => {
      const val = e.target.value;
      if (val === "custom") {
        $("custom-range").classList.remove("hidden");
        $("custom-range").classList.add("flex");
      } else {
        $("custom-range").classList.add("hidden");
        $("custom-range").classList.remove("flex");
        loadSales(val);
      }
    });

    $("apply-dates").addEventListener("click", () => {
      const start = $("sales-start").value;
      const end = $("sales-end").value;
      if (!start && !end) {
        $("sales-msg").textContent = "Please select a start or end date.";
        return;
      }
      loadSales("custom", start, end);
    });

    // ----- low stock -----
    async function loadStock() {
      try {
        const d = SAMPLE ? sampleStock : await api.sellerDashboard();
        const list = d.low_stock || d.low_stock_alerts || [];
        if (!list.length) { $("stock-msg").textContent = "All your products are above their stock threshold."; return; }
        $("stock-msg").textContent = "";
        $("stock-list").innerHTML = list.map((p) => `
          <li class="flex flex-wrap items-center justify-between gap-2 p-3">
            <a href="product.html?id=${p.product_id}" class="font-medium text-indigo-800 underline">${esc(p.title)}</a>
            <span class="rounded bg-amber-100 px-2 py-0.5 text-sm font-medium text-amber-900">Low stock: ${p.stock_quantity} left${p.threshold != null ? " (alert at " + p.threshold + ")" : ""}</span>
          </li>`).join("");
      } catch (err) {
        $("stock-msg").innerHTML = esc(notReady(err) ? "Stock alerts aren't available on the server yet." : err.message) + (notReady(err) ? hint : "");
      }
    }

    // ----- all products (with category and stock) -----
    const sampleProducts = { products: [
      { product_id: 1, title: "Ceramic Vase", category_id: 1, category: "Pottery", price: 450, stock_quantity: 20, threshold: 5 },
      { product_id: 2, title: "Silk Scarf", category_id: 2, category: "Textiles", price: 1200, stock_quantity: 1, threshold: 5 },
      { product_id: 3, title: "Carved Teak Coaster Set", category_id: 3, category: "Woodwork", price: 640, stock_quantity: 0, threshold: 5 },
      { product_id: 4, title: "Brass Diya Lamp", category_id: 4, category: "Metalwork", price: 720, stock_quantity: 4, threshold: 5 } ] };
    let allProducts = [];

    function stockBadge(p) {
      if (p.stock_quantity <= 0) return '<span class="rounded bg-red-100 px-2 py-0.5 text-sm font-medium text-red-800">Out of stock</span>';
      if (p.stock_quantity <= (p.threshold ?? 5)) return `<span class="rounded bg-amber-100 px-2 py-0.5 text-sm font-medium text-amber-900">Low stock: ${p.stock_quantity} left</span>`;
      return `<span class="rounded bg-green-100 px-2 py-0.5 text-sm font-medium text-green-900">In stock: ${p.stock_quantity}</span>`;
    }

    function renderProducts() {
      const cat = $("products-category").value;
      const list = allProducts.filter((p) => !cat || String(p.category_id) === cat);
      $("products-msg").textContent = list.length
        ? `Showing ${list.length} of ${allProducts.length} products.`
        : "No products in this category yet.";
      $("products-list").innerHTML = list.map((p) => `
        <li class="flex flex-wrap items-center justify-between gap-2 p-3">
          <div>
            <a href="product.html?id=${p.product_id}" class="font-medium text-indigo-800 underline">${esc(p.title)}</a>
            <p class="mt-1 text-sm text-slate-700">
              <span class="rounded bg-indigo-100 px-2 py-0.5 text-xs font-medium text-indigo-900">${esc(p.category)}</span>
              <span class="ml-2">${money(p.price)}</span>
            </p>
          </div>
          ${stockBadge(p)}
        </li>`).join("");
    }

    async function loadProducts() {
      try {
        const d = SAMPLE ? sampleProducts : await api.sellerProducts();
        allProducts = d.products || [];
        if (!allProducts.length) {
          $("products-msg").innerHTML = 'You have no products yet. <a href="artisan-listings.html" class="font-medium text-indigo-800 underline">Create a listing</a>';
          return;
        }
        const seen = new Map();
        allProducts.forEach((p) => seen.set(String(p.category_id), p.category));
        [...seen.entries()].sort((a, b) => a[1].localeCompare(b[1])).forEach(([id, name]) => {
          const o = document.createElement("option");
          o.value = id;
          o.textContent = name;
          $("products-category").appendChild(o);
        });
        renderProducts();
      } catch (err) {
        $("products-msg").innerHTML = esc(notReady(err) ? "Your product list isn't available on the server yet." : err.message) + (notReady(err) ? hint : "");
      }
    }
    $("products-category").addEventListener("change", renderProducts);

    // ----- orders -----
    function orderCard(o) {
      const date = o.created_at ? new Date(/(Z|[+-]\d\d:\d\d)$/.test(o.created_at) ? o.created_at : o.created_at + "Z")
        .toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";
      const next = NEXT[o.status];
      const items = (o.items || []).map((i) => `<li>${esc(i.title)} × ${i.quantity}</li>`).join("");
      return `
        <article aria-labelledby="o-${o.order_id}-h" class="rounded border border-stone-300 bg-white p-4" data-order="${o.order_id}">
          <div class="flex flex-wrap items-baseline justify-between gap-2">
            <h3 id="o-${o.order_id}-h" class="font-serif text-lg font-bold text-indigo-900">Order #${o.order_id}</h3>
            <span class="status-badge rounded bg-indigo-100 px-2 py-0.5 text-sm font-medium text-indigo-900">${esc(o.status)}</span>
          </div>
          <p class="text-sm text-slate-700">${esc(date)} · ${money(o.total)}</p>
          <ul class="mt-2 list-disc pl-5 text-sm">${items}</ul>
          <p class="mt-2 whitespace-pre-line text-sm text-slate-700"><span class="font-medium">Ship to:</span> ${esc(o.shipping_address || "")}</p>
          <p class="order-error mt-2 text-sm text-red-800" role="alert"></p>
          ${next ? `<button type="button" data-id="${o.order_id}" data-next="${next}" aria-label="Mark as ${next}, order ${o.order_id}"
              class="advance mt-3 rounded bg-indigo-900 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-700 focus:ring-offset-2 disabled:opacity-60">Mark as ${next}</button>`
            : '<p class="mt-3 text-sm font-medium text-green-900">Completed</p>'}
        </article>`;
    }
    function showOrders(list) {
      $("orders").innerHTML = list.map(orderCard).join("");
      $("orders-msg").textContent = list.length ? "" : "No orders for your crafts yet.";
    }
    async function loadOrders() {
      try {
        const d = SAMPLE ? { orders: sampleOrders } : await api.sellerOrders();
        showOrders(d.orders || []);
      } catch (err) {
        $("orders-msg").innerHTML = esc(notReady(err) ? "Order management isn't available on the server yet." : err.message) + (notReady(err) ? hint : "");
      }
    }

    $("orders").addEventListener("click", async (e) => {
      const btn = e.target.closest(".advance");
      if (!btn) return;
      const card = btn.closest("article");
      const errEl = card.querySelector(".order-error");
      errEl.textContent = "";
      btn.disabled = true;
      try {
        const id = Number(btn.dataset.id);
        let status = btn.dataset.next;
        if (SAMPLE) {
          sampleOrders = sampleOrders.map((o) => (o.order_id === id ? { ...o, status } : o));
        } else {
          const res = await api.updateOrderStatus(id, status);
          status = res.status || status;
        }
        await loadOrders();   // redraw from the source of truth
        $("orders-msg").textContent = `Order #${id} is now ${status}.`;
        $("orders-msg").focus();   // the button we pressed is gone, so keep keyboard focus on the confirmation
      } catch (err) {
        errEl.textContent = err.message;
        btn.disabled = false;
      }
    });

    document.querySelectorAll(".export").forEach((b) => b.addEventListener("click", async () => {
      $("export-msg").textContent = "";
      if (SAMPLE) { $("export-msg").textContent = "Export is turned off in sample mode."; return; }
      b.disabled = true;
      try { await downloadReport(b.dataset.export); }
      catch (err) { $("export-msg").textContent = err.message; }
      finally { b.disabled = false; }
    }));

    if (SAMPLE) $("sample-note").classList.remove("hidden");
    loadSales(); loadStock(); loadProducts(); loadOrders();
  </script>
</body>
</html>
