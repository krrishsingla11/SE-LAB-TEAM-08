<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handcrafted Goods Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-50 text-slate-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <a href="index.html" class="font-serif text-xl font-bold text-indigo-900">Handcrafted Goods</a>
      <nav id="nav" class="flex items-center gap-4 text-sm font-medium"></nav>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-16">
    <h1 class="max-w-xl font-serif text-4xl font-bold text-indigo-900 sm:text-5xl">Handmade by the people who made it.</h1>
    <p class="mt-4 max-w-xl text-lg text-slate-700">Browse pottery, textiles and woodwork from independent artisans, or open a shop of your own.</p>
    <div id="cta" class="mt-8 flex flex-wrap gap-3"></div>
  </main>

  <script>
    const loggedIn = !!localStorage.getItem("token");
    const nav = document.getElementById("nav");
    const cta = document.getElementById("cta");
    const link = "text-indigo-800 underline";
    const btnPrimary = "rounded bg-indigo-900 px-5 py-2 font-medium text-white hover:bg-indigo-800 focus:outline-none focus:ring-2 focus:ring-indigo-700 focus:ring-offset-2";
    const btnSecondary = "rounded border border-indigo-900 px-5 py-2 font-medium text-indigo-900 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-700 focus:ring-offset-2";

    if (loggedIn) {
      nav.innerHTML = '<span class="text-slate-700">You are logged in</span><button id="logout" class="' + link + '">Log out</button>';
      cta.innerHTML = '<a href="catalog.html" class="' + btnPrimary + '">Browse crafts</a>';
      document.getElementById("logout").addEventListener("click", () => {
        localStorage.removeItem("token");
        window.location.reload();
      });
    } else {
      nav.innerHTML = '<a href="login.html" class="' + link + '">Log in</a><a href="register.html" class="' + link + '">Create account</a>';
      cta.innerHTML = '<a href="register.html" class="' + btnPrimary + '">Create account</a><a href="login.html" class="' + btnSecondary + '">Log in</a>';
    }
  </script>
</body>
</html>
