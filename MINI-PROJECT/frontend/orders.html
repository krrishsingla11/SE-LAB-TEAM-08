<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My orders – Handcrafted Goods Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-50 text-slate-900">
  <header class="border-b border-stone-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-4">
      <a href="index.html" class="font-serif text-xl font-bold text-indigo-900">Handcrafted Goods</a>
      <nav id="site-nav"></nav>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-8">
    <h1 class="font-serif text-3xl font-bold text-indigo-900">My orders</h1>
    <p class="mt-2 text-slate-700">Track your orders and download invoices.</p>

    <div id="error-box" role="alert" class="mt-6 hidden rounded border border-red-300 bg-red-50 p-3 text-sm text-red-800"></div>
    <p id="status" class="mt-6 text-slate-700" role="status">Loading your orders...</p>
    <div id="orders" class="mt-4 space-y-5"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    if (!getToken()) window.location.href = "login.html";

    const STEPS = ["Pending", "Processing", "Shipped", "Delivered"];
    const money = (n) => "₹" + Number(n).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const ordersEl = document.getElementById("orders");
    const statusEl = document.getElementById("status");
    const errorBox = document.getElementById("error-box");

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function tracker(status) {
      const current = STEPS.indexOf(status);
      return '<ol aria-label="Order progress" class="mt-3 grid grid-cols-4 gap-1 text-center text-xs font-medium sm:text-sm">' +
        STEPS.map((step, i) => {
          const cls = i === current ? "bg-indigo-900 text-white"
            : i < current ? "bg-indigo-100 text-indigo-900"
            : "bg-stone-100 text-slate-700";
          return `<li class="rounded px-1 py-2 ${cls}"${i === current ? ' aria-current="step"' : ""}>${step}</li>`;
        }).join("") + "</ol>";
    }

    function card(o) {
      const date = o.created_at
        ? new Date(/(Z|[+-]\d\d:\d\d)$/.test(o.created_at) ? o.created_at : o.created_at + "Z").toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";
      const items = (o.items || []).map((i) =>
        `<li class="flex justify-between"><span>${esc(i.title)} × ${i.quantity}</span><span>${money(i.unit_price * i.quantity)}</span></li>`).join("");
      return `
        <article aria-labelledby="order-${o.order_id}-h" class="rounded border border-stone-300 bg-white p-4">
          <div class="flex flex-wrap items-baseline justify-between gap-2">
            <h2 id="order-${o.order_id}-h" class="font-serif text-xl font-bold text-indigo-900">Order #${o.order_id}</h2>
            <p class="text-sm text-slate-700">${esc(date)}</p>
          </div>
          ${tracker(o.status)}
          <ul class="mt-4 space-y-1 text-sm">${items}</ul>
          <p class="mt-3 font-medium">Total: ${money(o.total)}</p>
          <p class="mt-2 whitespace-pre-line text-sm text-slate-700"><span class="font-medium">Shipping to:</span> ${esc(o.shipping_address || "")}</p>
          <p class="invoice-error mt-3 hidden rounded border border-red-300 bg-red-50 p-2 text-sm text-red-800" role="alert"></p>
          <button type="button" data-invoice="${o.order_id}"
            class="mt-3 rounded border border-indigo-900 px-4 py-2 text-sm font-medium text-indigo-900 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-700 disabled:opacity-60">
            Download invoice (PDF)
          </button>
        </article>`;
    }

    ordersEl.addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-invoice]");
      if (!btn) return;
      const err = btn.parentElement.querySelector(".invoice-error");
      err.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "Preparing invoice...";
      try {
        await downloadInvoice(btn.dataset.invoice);
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Download invoice (PDF)";
      }
    });

    (async () => {
      try {
        const data = await api.orders();
        const orders = data.orders || [];
        if (!orders.length) {
          statusEl.innerHTML = 'You have no orders yet. <a href="catalog.html" class="font-medium text-indigo-800 underline">Browse crafts</a>';
          return;
        }
        statusEl.textContent = "";
        ordersEl.innerHTML = orders.map(card).join("");
      } catch (err) {
        statusEl.textContent = "";
        errorBox.textContent = err.message;
        errorBox.classList.remove("hidden");
      }
    })();
  </script>
</body>
</html>
